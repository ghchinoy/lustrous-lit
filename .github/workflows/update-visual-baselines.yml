name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to regenerate and commit Playwright visual baselines on"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate Visual Baselines (Linux)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configure Git safe directory & author
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Build Storybook & update visual snapshots
        run: pnpm build-storybook && pnpm test:visual:update

      - name: Commit and push updated screenshot baselines
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          git add -A 'src/**/screenshots/*.webp' 'src/**/screenshots'
          if git diff --cached --quiet; then
            echo "No visual baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(visual): update Playwright visual baselines"
          git push origin "HEAD:${TARGET_BRANCH}"
