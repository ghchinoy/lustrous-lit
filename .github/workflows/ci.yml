name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, SSR, Unit, Visual & A11y
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mark workspace safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify clean-room & CSP hygiene
        run: pnpm check:clean

      - name: Typecheck library & example app
        run: pnpm typecheck:all

      - name: Build package & Custom Elements Manifest
        run: pnpm build

      - name: Verify custom-elements.json & Agent Plugin artifacts are up to date
        run: |
          pnpm check:plugin
          git diff --exit-code -- custom-elements.json plugins/lustrous-lit

      - name: Run SSR smoke & Chromium hydration checks
        run: pnpm test:ssr

      - name: Run unit tests (Chromium)
        run: pnpm test

      - name: Build example app
        run: pnpm build:example

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run visual regression tests
        id: visual
        run: pnpm test:visual:ci

      - name: Upload visual regression diffs
        if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lustrous-visual-diffs
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 14

      - name: Run WCAG 2.1 AA accessibility checks
        if: ${{ !cancelled() }}
        id: a11y
        run: pnpm test:a11y

      - name: Upload accessibility report
        if: failure() && steps.a11y.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lustrous-a11y-report
          path: |
            playwright-report-a11y/
            test-results/
          retention-days: 14

  cross-browser:
    name: Unit Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run unit tests on ${{ matrix.browser }}
        env:
          HOME: /root
          LUSTROUS_BROWSERS: ${{ matrix.browser }}
        run: pnpm test
