<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Studio — Lustrous Design System</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("meridian.theme") || "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
    </script>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="lustrous-root">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
